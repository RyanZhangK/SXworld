name: Build & Release Modpack

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.1.2），留空则使用 pack.toml 中的版本'
        required: false
        type: string

jobs:
  build:
    name: 打包整合包
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: 安装 packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: 读取整合包版本
        id: meta
        run: |
          PACK_VERSION=$(grep '^version' pack.toml | sed 's/version = "\(.*\)"/\1/')
          INPUT_VERSION="${{ github.event.inputs.version }}"
          VERSION="${INPUT_VERSION:-$PACK_VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pack_name=$(grep '^name' pack.toml | sed 's/name = "\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: 更新版本号（仅 workflow_dispatch 且指定了版本）
        if: github.event.inputs.version != ''
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.meta.outputs.version }}\"/" pack.toml

      - name: 刷新 packwiz 索引
        run: packwiz refresh

      - name: 预下载 CurseForge 限制文件到 packwiz 缓存
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          CACHE_DIR="$HOME/.cache/packwiz/cache/import"
          mkdir -p "$CACHE_DIR"
          # 先尝试 API 获取下载链接，部分文件 API 返回 null，回退到 CDN 直链
          # DeathQuotes: project 253947, file 6559203
          DOWNLOAD_URL=$(curl -sSL \
            -H "x-api-key: $CF_API_KEY" \
            "https://api.curseforge.com/v1/mods/253947/files/6559203/download-url" \
            | jq -r '.data // empty')
          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL="https://edge.forgecdn.net/files/6559/203/deathquotes-forge-1.20.1_1.20.4-3.4.jar"
          fi
          curl -sSL -o "$CACHE_DIR/deathquotes-forge-1.20.1_1.20.4-3.4.jar" "$DOWNLOAD_URL"

          # FastBoot: project 1030285, file 5696829
          DOWNLOAD_URL=$(curl -sSL \
            -H "x-api-key: $CF_API_KEY" \
            "https://api.curseforge.com/v1/mods/1030285/files/5696829/download-url" \
            | jq -r '.data // empty')
          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL="https://edge.forgecdn.net/files/5696/829/fastboot-1.20.x-1.2.jar"
          fi
          curl -sSL -o "$CACHE_DIR/fastboot-1.20.x-1.2.jar" "$DOWNLOAD_URL"

          # Enhanced Boss Bars: project 580036, file 7543365
          DOWNLOAD_URL=$(curl -sSL \
            -H "x-api-key: $CF_API_KEY" \
            "https://api.curseforge.com/v1/mods/580036/files/7543365/download-url" \
            | jq -r '.data // empty')
          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL="https://edge.forgecdn.net/files/7543/365/%5B1.5%5D%20Enhanced%20Boss%20Bars.zip"
          fi
          curl -sSL -g -o "$CACHE_DIR/[1.5] Enhanced Boss Bars.zip" "$DOWNLOAD_URL"

      - name: 导出 .mrpack
        run: |
          packwiz modrinth export -o "深巷世界-v${{ steps.meta.outputs.version }}.mrpack"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: modpack-${{ steps.meta.outputs.version }}
          path: 深巷世界-v${{ steps.meta.outputs.version }}.mrpack
          retention-days: 30

      - name: 生成 Changelog
        id: changelog
        run: |
          # 获取上一个 tag 到当前的提交记录作为 changelog
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s" --no-merges | head -20)
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          name: 深巷世界 v${{ steps.meta.outputs.version }}
          body: |
            ## 深巷世界 v${{ steps.meta.outputs.version }}

            **Minecraft**: 1.20.1 | **Forge**: 47.4.18

            ### 更新内容
            ${{ steps.changelog.outputs.changelog }}

            ### 安装方式
            1. 下载 `.mrpack` 文件
            2. 在 [Modrinth App](https://modrinth.com/app) 或 [Prism Launcher](https://prismlauncher.org/) 中导入
          files: 深巷世界-v${{ steps.meta.outputs.version }}.mrpack
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
